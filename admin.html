<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>D1 Application Review | SwamiG Institute</title>
  <style>
    :root { --bg:#080910; --panel:#141722; --ink:#f5f2e7; --muted:#b9b7ad; --gold:#d6b85a; --line:rgba(255,255,255,.13); --danger:#ff9a9a; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    main { width:min(100% - 28px, 1180px); margin:28px auto 60px; }
    a { color:#f2dc91; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:15px; flex-wrap:wrap; margin-bottom:18px; }
    h1 { margin:0; }
    .panel { padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:17px; }
    .login { display:grid; grid-template-columns:minmax(220px,1fr) auto; gap:10px; }
    input,button { border-radius:10px; padding:11px 13px; font:inherit; }
    input { color:var(--ink); background:#0d0f17; border:1px solid var(--line); }
    button { border:0; background:var(--gold); color:#1b1509; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #status { color:var(--muted); margin:12px 0 0; }
    .table-wrap { margin-top:18px; overflow:auto; border:1px solid var(--line); border-radius:15px; }
    table { width:100%; min-width:980px; border-collapse:collapse; background:var(--panel); }
    th,td { text-align:left; vertical-align:top; padding:12px; border-bottom:1px solid var(--line); }
    th { color:#f2dc91; background:#1b1f2c; position:sticky; top:0; }
    td { color:#dedbd1; }
    .message { max-width:380px; white-space:pre-wrap; }
    .empty { padding:28px; text-align:center; color:var(--muted); }
    @media(max-width:600px){ .login{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>D1 Application Review</h1>
      <div><a href="index.html">← Return to application</a></div>
    </div>
    <img src="SwamiG.gif" width="64" height="64" alt="SwamiG Institute logo" style="border-radius:50%;object-fit:cover">
  </div>

  <section class="panel">
    <form id="tokenForm" class="login">
      <input id="adminToken" type="password" autocomplete="current-password" placeholder="Enter the ADMIN_TOKEN secret" required>
      <button id="loadButton" type="submit">Load Applications</button>
    </form>
    <p id="status">The token is sent only as an Authorization header and is not stored by this page.</p>
  </section>

  <div id="results"></div>
</main>
<script>
  const form = document.getElementById('tokenForm');
  const tokenInput = document.getElementById('adminToken');
  const loadButton = document.getElementById('loadButton');
  const status = document.getElementById('status');
  const results = document.getElementById('results');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    loadButton.disabled = true;
    status.textContent = 'Loading…';
    results.innerHTML = '';

    try {
      const response = await fetch('/api/submissions?limit=100', {
        headers: { Authorization: `Bearer ${tokenInput.value}`, Accept: 'application/json' }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Unable to load applications.');

      status.textContent = `${data.count} application(s) loaded.`;
      if (!data.applications.length) {
        results.innerHTML = '<div class="panel empty" style="margin-top:18px">No applications have been submitted.</div>';
        return;
      }

      const rows = data.applications.map(item => `
        <tr>
          <td>${escapeHtml(item.created_at)}</td>
          <td>${escapeHtml(item.submission_id)}</td>
          <td>${escapeHtml(item.legal_name)}</td>
          <td>${escapeHtml(item.preferred_name)}</td>
          <td><a href="mailto:${escapeHtml(item.email)}">${escapeHtml(item.email)}</a></td>
          <td>${escapeHtml(item.phone)}</td>
          <td>${escapeHtml(item.interest)}</td>
          <td class="message">${escapeHtml(item.message)}</td>
        </tr>`).join('');

      results.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Submitted</th><th>Confirmation</th><th>Legal name</th><th>Preferred name</th><th>Email</th><th>Phone</th><th>Interest</th><th>Message</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    } catch (error) {
      status.textContent = error.message;
      status.style.color = 'var(--danger)';
    } finally {
      loadButton.disabled = false;
    }
  });
</script>
</body>
</html>
